[package]
name = "microcontroller"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
dynamixel.path = "../dynamixel"

embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy.git", rev = "ee23412d91ce7b1482532016c4baee9425d897e2", features = [
    "defmt",
] }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git", rev = "ee23412d91ce7b1482532016c4baee9425d897e2", features = [
    "defmt",
] }
embassy-futures = { git = "https://github.com/embassy-rs/embassy.git", rev = "ee23412d91ce7b1482532016c4baee9425d897e2" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", rev = "ee23412d91ce7b1482532016c4baee9425d897e2", features = [
    "arch-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", rev = "ee23412d91ce7b1482532016c4baee9425d897e2", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-rp = { git = "https://github.com/embassy-rs/embassy.git", rev = "ee23412d91ce7b1482532016c4baee9425d897e2", features = [
    "defmt",
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
    "rp235xa",
    "binary-info",
] }
embassy-usb = { git = "https://github.com/embassy-rs/embassy.git", rev = "ee23412d91ce7b1482532016c4baee9425d897e2", features = [
    "defmt",
] }

defmt = "0.3"
defmt-rtt = "0.4"

cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.0"
critical-section = "1.1"
panic-probe = { version = "0.3", features = ["print-defmt"] }
heapless = "0.8.0"
nb = "1.1.0"

[profile.release]
debug = 2

[profile.dev]
lto = true
opt-level = "z"
